# datasource comes from env vars: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.jmx.enabled=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# small pool, and tolerate Neon suspending idle connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000

management.endpoint.health.probes.enabled=true

# no default: the app refuses to start if this is missing
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ORIGINS:https://fraudulent-checkout-frontend.vercel.app}