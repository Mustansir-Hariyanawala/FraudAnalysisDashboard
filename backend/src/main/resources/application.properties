spring.application.name=demo

spring.datasource.url=jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin@1109

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# bootstrap admin (created only when staff_users is empty)
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=${ADMIN_PASSWORD:ChangeMe@12345}